groups:
  - name: finalframe-api
    rules:
      - alert: FinalFrameApiUnavailable
        expr: up{job="finalframe-api"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: FinalFrame API metrics target is unavailable
          description: At least one API replica has been unreachable for two minutes.

      - alert: FinalFrameDependencyUnavailable
        expr: finalframe_dependency_ready == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: FinalFrame dependency is not ready
          description: "{{ $labels.dependency }} has remained unavailable on {{ $labels.instance }}."

      - alert: FinalFrameHighServerErrorRate
        expr: |
          sum(rate(finalframe_http_requests_total{status=~"5.."}[5m]))
            /
          clamp_min(sum(rate(finalframe_http_requests_total[5m])), 0.001)
            > 0.02
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: FinalFrame API server-error rate is high
          description: More than 2% of API requests have returned 5xx responses for ten minutes.

      - alert: FinalFrameSlowApi
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(finalframe_http_request_duration_seconds_bucket[10m]))
          ) > 2
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: FinalFrame API p95 latency is high
          description: API p95 latency has exceeded two seconds for ten minutes.

      - alert: FinalFrameWorkerFailing
        expr: increase(finalframe_worker_failures_total[15m]) >= 3
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: FinalFrame background worker is repeatedly failing
          description: "{{ $labels.worker }} has failed at least three times in fifteen minutes."

      - alert: FinalFrameFastWorkerStalled
        expr: |
          time() - finalframe_worker_last_success_timestamp_seconds{
            worker=~"asset-processing|email-outbox|project-deletion|storage-cleanup"
          } > 900
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: FinalFrame background worker has stalled
          description: "{{ $labels.worker }} has not completed successfully for at least fifteen minutes."

      - alert: FinalFrameRetentionWorkerStalled
        expr: time() - finalframe_worker_last_success_timestamp_seconds{worker="retention-cleanup"} > 10800
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: FinalFrame retention cleanup has stalled
          description: Retention cleanup has not completed successfully for at least three hours.

      - alert: FinalFrameApiMemoryHigh
        expr: finalframe_process_resident_memory_bytes > 1073741824
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: FinalFrame API memory usage is high
          description: An API replica has used more than 1 GiB of resident memory for fifteen minutes.
