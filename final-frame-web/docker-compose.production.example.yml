services:
  finalframe-web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:?set PUBLIC_SITE_URL}
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:?set PUBLIC_API_URL}
        NEXT_PUBLIC_STORAGE_ORIGIN: ${PUBLIC_STORAGE_ORIGIN:?set PUBLIC_STORAGE_ORIGIN}
        HSTS_SCOPE: ${HSTS_SCOPE:-host}
        HSTS_MAX_AGE_SECONDS: ${HSTS_MAX_AGE_SECONDS:-15552000}
        HSTS_DOMAIN_CONTROL_CONFIRMED: ${HSTS_DOMAIN_CONTROL_CONFIRMED:-false}
        INTERNAL_API_URL: ${INTERNAL_API_URL:?set INTERNAL_API_URL to the private API or load-balancer URL}
        RELEASE_VERSION: ${RELEASE_VERSION:?set RELEASE_VERSION}
    image: ${FINALFRAME_WEB_IMAGE:?set FINALFRAME_WEB_IMAGE}
    restart: unless-stopped
    init: true
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DEPLOYMENT_ENVIRONMENT: production
      NEXT_PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:?set PUBLIC_SITE_URL}
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:?set PUBLIC_API_URL}
      NEXT_PUBLIC_STORAGE_ORIGIN: ${PUBLIC_STORAGE_ORIGIN:?set PUBLIC_STORAGE_ORIGIN}
      HSTS_SCOPE: ${HSTS_SCOPE:-host}
      HSTS_MAX_AGE_SECONDS: ${HSTS_MAX_AGE_SECONDS:-15552000}
      HSTS_DOMAIN_CONTROL_CONFIRMED: ${HSTS_DOMAIN_CONTROL_CONFIRMED:-false}
      NEXT_PUBLIC_SITE_NAME: FinalFrame
      NEXT_PUBLIC_RELEASE_VERSION: ${RELEASE_VERSION:?set RELEASE_VERSION}
      RELEASE_VERSION: ${RELEASE_VERSION:?set RELEASE_VERSION}
      NEXT_PUBLIC_TELEMETRY_ENABLED: "true"
      NEXT_PUBLIC_TELEMETRY_SAMPLE_RATE: "0.1"
      API_URL: ${INTERNAL_API_URL:?set INTERNAL_API_URL to the private API or load-balancer URL}
      NEXTAUTH_URL: ${PUBLIC_SITE_URL:?set PUBLIC_SITE_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?set NEXTAUTH_SECRET}
      SESSION_COOKIE_NAME: __Secure-next-auth.session-token
      OBSERVABILITY_ENDPOINT: ""
      OBSERVABILITY_TOKEN: ""
      OBSERVABILITY_LOG_TO_STDOUT: "true"
      TELEMETRY_MAX_BODY_BYTES: "16384"
      NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ""
      NEXT_PUBLIC_BING_SITE_VERIFICATION: ""
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
      - /app/.next/cache:size=128m,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
